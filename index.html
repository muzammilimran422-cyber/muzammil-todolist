<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-do List</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="Assets/style.css">
</head>

<body class="bg-dark text-light">

  <div class="container mt-5">
    <h1 class="mt-5 text-center text-danger">To-do List</h1>

    <div class="container mt-5">
      <div class="row">
        <div class="col-10 m-auto box">
          <div class="row">
            <div class="col-6">
              <form action="">
                <input type="text" placeholder="Enter List Item Here" class="form-control mb-3" id="inpt">
                <button type="button" class="btn btn-danger" onclick="todo()">Add</button>
              </form>
            </div>

            <div class="col-6">
              <h5 class="text-danger">List Items</h5>
              <div><ol id="show"></ol></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="Assets/script.js"></script>
</body>

</html>
